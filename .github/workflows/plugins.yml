name: plugins

# The plugin, its two marketplace files, and what generates its skill and rule: the registry's
# guidance files and the generator. push is limited to main so a pull request branch runs once.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "apps/mcp/npm/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - "adapter/internal/mcp/guidance/**"
      - "adapter/internal/mcp/plugin.go"
      - "adapter/internal/auth/**"
      - "adapter/cmd/plugin-guidance/**"
      - ".github/workflows/plugins.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "apps/mcp/npm/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - "adapter/internal/mcp/guidance/**"
      - "adapter/internal/mcp/plugin.go"
      - "adapter/internal/auth/**"
      - "adapter/cmd/plugin-guidance/**"
      - ".github/workflows/plugins.yml"

  # The release pull request is opened with the built-in token, which starts no pull_request
  # workflow, so the release workflow starts this one on its branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check compares with the merge base.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: adapter/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fails when the skill or the rule differs from what the registry's guidance generates.
      - name: Generated files match the registry
        working-directory: adapter
        run: go test ./cmd/plugin-guidance ./internal/mcp -race

      - name: Checks and their tests
        run: node --test plugins/check.test.mjs

      - name: Check the plugin
        run: node plugins/check.mjs

      - name: Version changes with the plugin
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node plugins/check.mjs --base "${BASE}"

      - name: The stamping and its tests
        run: node --test plugins/release.test.mjs

      # A pin this pull request changes must be a version npm serves.
      - name: The pinned data server is published
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node plugins/release.mjs published "${BASE}"

      - name: Prettier
        run: npx --yes prettier@3.9.6 --check plugins .claude-plugin .cursor-plugin

      # The validator of Claude Code, pinned. It reads the manifests, the MCP file and both marketplaces.
      - name: Validate for Claude Code
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate plugins/pds
          npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate .

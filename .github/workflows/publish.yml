name: publish

# A published GitHub Release builds the tag it names, except an mcp-v tag, which
# only tells the MCP release pipeline that it exists. Pushes to main do not
# publish images or the chart. The workflow file is read from the default
# branch, so checkout the release tag rather than that branch tip.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    # An mcp-v tag releases the MCP server alone; dispatch-mcp hands it to the release pipeline.
    if: ${{ !startsWith(github.event.release.tag_name, 'mcp-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          check-latest: true
          cache: npm

      - uses: docker/setup-buildx-action@v3

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: version
        id: ver
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          v="${tag#v}"
          if [[ ! "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag ${tag} is not a SemVer version OCI can carry" >&2
            exit 1
          fi
          echo "chart=${v}" >>"${GITHUB_OUTPUT}"
          echo "image=${v}" >>"${GITHUB_OUTPUT}"

      - name: npm ci
        run: npm ci

      - name: vite build
        run: npm -w @pds/ui run build

      # The hosted deployment serves the landing page at / from this image.
      - name: landing build
        run: scripts/build-landing.sh apps/ui/dist/landing

      - name: login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: login helm oci
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build and push images
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          set -euo pipefail
          adapter=ghcr.io/percona/percona-services-adapter
          ui=ghcr.io/percona/percona-services-ui
          docker buildx build --platform linux/amd64 --push --build-arg "VERSION=${IMAGE}" -t "${adapter}:${IMAGE}" -f adapter/Dockerfile .
          docker buildx build --platform linux/amd64 --push -t "${ui}:${IMAGE}" apps/ui
          cosign sign --yes "${adapter}:${IMAGE}"
          cosign sign --yes "${ui}:${IMAGE}"

      - name: package and push chart
        env:
          CHART: ${{ steps.ver.outputs.chart }}
          IMAGE: ${{ steps.ver.outputs.image }}
        run: |
          set -euo pipefail
          scripts/helm-deps.sh
          sed -i "s/^version: .*/version: ${CHART}/" charts/pds/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${IMAGE}\"/" charts/pds/Chart.yaml
          helm package charts/pds -d /tmp
          helm push "/tmp/pds-${CHART}.tgz" oci://ghcr.io/percona/charts
          cosign sign --yes "ghcr.io/percona/charts/pds:${CHART}"

      # Tells the repository that deploys the hosted service that this
      # release's images and chart exist. It runs last, so a failed push never
      # triggers a deploy. OPS_DISPATCH_TOKEN is a fine-grained token scoped to
      # percona/pds-ops with Contents: read and write, which repository_dispatch
      # requires. The ops deploy workflow listens for event type
      # release-published and reads client_payload.tag and client_payload.version.
      - name: dispatch deploy to ops
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.ver.outputs.image }}
        run: |
          set -euo pipefail
          jq -n --arg tag "${TAG}" --arg version "${VERSION}" \
            '{event_type: "release-published", client_payload: {tag: $tag, version: $version}}' |
            gh api --method POST repos/percona/pds-ops/dispatches --input -

  # The MCP server and the pds plugin are published by the pipeline in percona/pds-ops, which
  # checks out this repository at the tag. This job only tells it that a release exists: the tag
  # is checked here so a malformed one never starts a publish. OPS_DISPATCH_TOKEN is the token
  # the deploy dispatch above uses. The ops workflow listens for event type mcp-release-published
  # and reads client_payload.tag and client_payload.version.
  dispatch-mcp:
    if: ${{ startsWith(github.event.release.tag_name, 'mcp-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # No checkout: the token below never runs next to code from the tag.
      - name: dispatch the MCP release to ops
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#mcp-v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag ${TAG} is not mcp-v followed by a SemVer version" >&2
            exit 1
          fi
          jq -n --arg tag "${TAG}" --arg version "${version}" \
            '{event_type: "mcp-release-published", client_payload: {tag: $tag, version: $version}}' |
            gh api --method POST repos/percona/pds-ops/dispatches --input -

# Source: pds/templates/hub-database.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-hub-database
  namespace: default
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    percona.com/team: platform
    app.kubernetes.io/component: hub-database
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    percona.com/owner: platform-team
spec:
  # A missing CRD on upgrade is terminal, not transient: Helm never installs a
  # subchart's CRDs on upgrade, so retrying cannot make one appear. Retrying
  # anyway turned a clear failure into an eight minute one.
  backoffLimit: 6
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        helm.sh/chart: pds-0.1.0
        app.kubernetes.io/name: pds
        app.kubernetes.io/instance: pds
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pds
        percona.com/team: platform
        app.kubernetes.io/component: hub-database
    spec:
      restartPolicy: OnFailure
      # No priorityClassName. This runs as a pre-install hook, and the chart's
      # PriorityClass is an ordinary release resource that does not exist yet,
      # so naming it makes the API server refuse the pod.
      serviceAccountName: platform-hub-database
      containers:
        - name: apply
          image: "alpine/k8s:1.32.3"
          imagePullPolicy: IfNotPresent
          env:
            - name: IS_UPGRADE
              value: "false"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # A fresh install already has the CRDs: Helm applies a subchart's
              # crds directory before it runs pre-install hooks, so the only
              # wait needed there is for propagation. An upgrade never gets
              # them, so a missing CRD is reported at once rather than waited on.
              if [ "${IS_UPGRADE}" = "true" ]; then
                deadline=$(date +%s)
              else
                deadline=$(( $(date +%s) + 60 ))
              fi
              while ! kubectl get crd perconapgclusters.pgv2.percona.com >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "${deadline}" ]; then
                  echo "The PerconaPGCluster CRD is not registered in this cluster."
                  echo
                  echo "Helm installs a subchart's CRDs on install but never on upgrade, so"
                  echo "turning adapter.database.enabled on for an existing release needs them"
                  echo "applied once first:"
                  echo
                  echo "  helm show crds percona/pg-operator --version 3.0.0 | kubectl apply --server-side -f -"
                  echo
                  echo "Then run the same helm upgrade again."
                  exit 1
                fi
                sleep 5
              done
              # The object existing is not the same as the API serving it. An
              # apply that arrives before the CRD is established fails with no
              # matches for kind, which reads like a missing CRD and is not.
              kubectl wait --for=condition=established --timeout=60s \
                crd/perconapgclusters.pgv2.percona.com
              # The heredoc is quoted so the shell expands nothing in the body.
              # A label or annotation carrying a dollar sign would otherwise be
              # mangled, or abort the script under set -u.
              # The CRD check above is terminal, which is why backoffLimit is 0
              # on upgrade. The apply is not: an admission webhook or API server
              # blip should be retried rather than failing the release, so the
              # retry lives here instead of in the Job.
              # The manifest is held in a variable rather than piped. A pipe
              # is consumed by the first attempt, so every retry would read end
              # of file and fail with no objects passed to apply, which is not
              # the error that was being retried.
              manifest=$(cat <<'EOF'

              apiVersion: pgv2.percona.com/v2
              kind: PerconaPGCluster
              metadata:
                name: platform-hub-db
                namespace: default
                labels:
                  helm.sh/chart: pds-0.1.0
                  app.kubernetes.io/name: pds
                  app.kubernetes.io/instance: pds
                  app.kubernetes.io/version: "0.1.0"
                  app.kubernetes.io/managed-by: Helm
                  app.kubernetes.io/part-of: pds
                  percona.com/team: platform
                  app.kubernetes.io/component: hub-database
              spec:
                crVersion: 3.0.0
                image: "docker.io/percona/percona-distribution-postgresql:18.3-2"
                postgresVersion: 18
                # The adapter connects as this role, to this database. The
                # operator owns the password and writes it to
                # <cluster>-pguser-<user>, so no credential passes through
                # values or through a chart rendered Secret.
                users:
                  - name: "hub"
                    databases:
                      - "hub"
                instances:
                  - name: instance1
                    replicas: 1
                    resources:
                      limits:
                        cpu: "1"
                        memory: 2Gi
                      requests:
                        cpu: 200m
                        memory: 512Mi
                    dataVolumeClaimSpec:
                      accessModes:
                        - ReadWriteOnce
                      storageClassName: "gp3-encrypted"
                      resources:
                        requests:
                          storage: 10Gi
                backups:
                  pgbackrest:
                    image: "docker.io/percona/percona-pgbackrest:2.58.0-1"
                    repos:
                      - name: repo1
                        volume:
                          volumeClaimSpec:
                            accessModes:
                              - ReadWriteOnce
                            storageClassName: "gp3-encrypted"
                            resources:
                              requests:
                                storage: 10Gi
              EOF
              )
              attempt=1
              until printf '%s\n' "${manifest}" | kubectl apply -f -; do
                if [ "${attempt}" -ge 3 ]; then
                  echo "could not apply the cluster after ${attempt} attempts"
                  exit 1
                fi
                echo "apply failed, retrying"
                attempt=$(( attempt + 1 ))
                sleep 5
              done
---
# Source: pds/templates/state-key-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-state-key
  namespace: default
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    percona.com/team: platform
    app.kubernetes.io/component: state-key
  annotations:
    # Weight 5 puts this before the database hook at 10, so the key exists by
    # the time the adapter Deployment is applied and its secretKeyRef resolves.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    percona.com/owner: platform-team
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        helm.sh/chart: pds-0.1.0
        app.kubernetes.io/name: pds
        app.kubernetes.io/instance: pds
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pds
        percona.com/team: platform
        app.kubernetes.io/component: state-key
    spec:
      restartPolicy: OnFailure
      # No priorityClassName. This runs as a pre-install hook, and the chart's
      # PriorityClass is an ordinary release resource that does not exist yet.
      serviceAccountName: platform-state-key
      containers:
        - name: mint
          image: "alpine/k8s:1.32.3"
          imagePullPolicy: IfNotPresent
          env:
            - name: SECRET_NAME
              value: "platform-state-key"
            - name: SECRET_FIELD
              value: "STATE_ENCRYPTION_KEY"
            - name: SECRET_NAMESPACE
              value: "default"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if kubectl get secret "${SECRET_NAME}" -n "${SECRET_NAMESPACE}" >/dev/null 2>&1; then
                echo "the state encryption key is already present, leaving it as it is"
                exit 0
              fi
              # 32 bytes is the AES-256 key the adapter refuses to run without.
              # The value is piped straight into kubectl and never echoed: it
              # would otherwise land in the Job log, which is the one place it
              # must not be.
              key="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
              # create, not apply: a second Job that raced this one must fail on
              # AlreadyExists rather than overwrite a key that has already
              # sealed credentials.
              # No labels are set on it, and the Role grants no patch. The
              # Secret is deliberately not part of the release: it has to
              # outlive an uninstall, because the rows it opens do. Labelling it
              # as managed by Helm would say the opposite, and a patch verb here
              # would be a way to overwrite a key that has already sealed
              # credentials.
              if printf '%s' "${key}" | kubectl create secret generic "${SECRET_NAME}" \
                -n "${SECRET_NAMESPACE}" --from-file="${SECRET_FIELD}=/dev/stdin"; then
                echo "minted the state encryption key"
              elif kubectl get secret "${SECRET_NAME}" -n "${SECRET_NAMESPACE}" >/dev/null 2>&1; then
                echo "another run minted the state encryption key first, leaving it as it is"
              else
                echo "could not mint the state encryption key"
                exit 1
              fi

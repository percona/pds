# Source: pds/templates/tests/adapter-health.yaml
apiVersion: v1
kind: Pod
metadata:
  name: pds-test-adapter-health
  namespace: default
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: "curlimages/curl:8.11.1"
      imagePullPolicy: IfNotPresent
      # Liveness and readiness must be green, and the features route must
      # answer. This probe carries no session, so 200 and 401 both count.
      args:
        - /bin/sh
        - -c
        - |
          set -eu
          base="http://pds-adapter:8080"
          curl --fail --silent --show-error --max-time 10 "$base/healthz" | grep -q '"status":"ok"'
          curl --fail --silent --show-error --max-time 10 "$base/readyz" | grep -q '"status":"ok"'
          # 401 is a pass. The route needs a signed in organization now, and this
          # probe carries no session, so an answer at all is what proves the
          # request reached the adapter and its router ran.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$base/api/features")
          case "$code" in
            200|401) echo "features responded $code" ;;
            *) echo "features responded $code"; exit 1 ;;
          esac
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 100
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 20m
          memory: 32Mi

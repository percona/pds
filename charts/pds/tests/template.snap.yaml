apiVersion: apps/v1
kind: Deployment
metadata:
  name: pds-adapter
  namespace: default
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/component: adapter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pds
      app.kubernetes.io/instance: pds
      app.kubernetes.io/component: adapter
  template:
    metadata:
      labels:
        helm.sh/chart: pds-0.1.0
        app.kubernetes.io/name: pds
        app.kubernetes.io/instance: pds
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pds
        app.kubernetes.io/component: adapter
    spec:
      serviceAccountName: pds
      priorityClassName: pds-bulk
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: ghcr.io/percona/percona-services-adapter:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ADAPTER_ADDR
              value: ":8080"
            - name: ADAPTER_ENV
              value: "prod"
            - name: ADAPTER_LOG_LEVEL
              value: "info"
            - name: ADAPTER_SHUTDOWN_TIMEOUT
              value: "15s"
            - name: EVEREST_URL
              value: ""
            - name: EVEREST_NAMESPACE
              value: "pds"
            - name: EVEREST_BACKUP_STORAGE
              value: "s3"
            - name: EVEREST_MONITORING_CONFIG
              value: ""
            - name: EVEREST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pds-everest
                  key: EVEREST_TOKEN
                  optional: true
            - name: EVEREST_ACCOUNTS_SECRET
              value: "everest-accounts"
            - name: PMM_URL
              value: ""
            - name: PMM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pds-pmm
                  key: PMM_TOKEN
                  optional: true
            - name: OIDC_ISSUER
              value: ""
            - name: SN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pds-servicenow
                  key: SN_API_KEY
                  optional: true
            - name: SN_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pds-servicenow
                  key: SN_CLIENT_TOKEN
                  optional: true
            - name: SN_SECRET_NAME
              value: "pds-servicenow"
            - name: ASSISTANT_SECRET_NAME
              value: "pds-assistant"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CURSOR_SECRET_NAME
              value: "pds-cursor"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hub-db-url
                  key: DATABASE_URL
            - name: HUB_ORGANIZATION
              value: "default"
            - name: SESSION_LIFETIME
              value: "720h"
            - name: SESSION_IDLE_TIMEOUT
              value: "168h"
            - name: INVITE_TTL
              value: "48h"
            - name: STATE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pds-state-key
                  key: STATE_ENCRYPTION_KEY
            - name: STATE_ENCRYPTION_KEYS_RETIRED
              valueFrom:
                secretKeyRef:
                  name: pds-state-key
                  key: STATE_ENCRYPTION_KEYS_RETIRED
                  optional: true
            - name: ACTIVITY_CONFIGMAP
              value: "pds-activity"
            - name: HUB_JOIN_SECRET
              value: "pds-join-tokens"
            - name: HUB_INVENTORY_CONFIGMAP
              value: "pds-hub-inventory"
            - name: HUB_WORK_CONFIGMAP
              value: "pds-hub-work"
            - name: HUB_JOIN_TOKEN_TTL
              value: "24h"
            - name: HUB_HEARTBEAT_STALE
              value: "90s"
            - name: HUB_CLUSTER_REGION
              value: "us-west-2"
            - name: HUB_GIT_DIR
              value: "/var/lib/hub-git"
            - name: HUB_PUBLIC_URL
              value: "https://hub.example"
            - name: HUB_AGENT_IMAGE
              value: "ghcr.io/percona/percona-services-adapter:0.1.0"
            - name: ADAPTER_FEATURE_ACTIVITY
              value: "true"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hub-git
              mountPath: /var/lib/hub-git
      volumes:
        # The root filesystem is read only, so the process needs a writable /tmp.
        - name: tmp
          emptyDir: {}
        - name: hub-git
          persistentVolumeClaim:
            claimName: pds-hub-git

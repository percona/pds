apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pds-pmm-admin
  namespace: everest-system
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/component: monitoring
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  # get on the one name, create with no resourceNames because the first write
  # of a named object cannot use them. There is no update: PMM keeps the
  # password it started with, so replacing it would lock the hook out.
  # patch only adds the keep policy to a Secret the subchart once rendered.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "pmm-secret"
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]

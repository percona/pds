# Source: pds/templates/tests/adapter-health.yaml
apiVersion: v1
kind: Pod
metadata:
  name: pds-test-adapter-health
  namespace: everest-system
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: "curlimages/curl:8.11.1"
      imagePullPolicy: IfNotPresent
      # Liveness and readiness must be green, and the features route must
      # answer. This probe carries no session, so 200 and 401 both count.
      args:
        - /bin/sh
        - -c
        - |
          set -eu
          base="http://pds-adapter:8080"
          curl --fail --silent --show-error --max-time 10 "$base/healthz" | grep -q '"status":"ok"'
          curl --fail --silent --show-error --max-time 10 "$base/readyz" | grep -q '"status":"ok"'
          # 401 is a pass. The route needs a signed in organization now, and this
          # probe carries no session, so an answer at all is what proves the
          # request reached the adapter and its router ran.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$base/api/features")
          case "$code" in
            200|401) echo "features responded $code" ;;
            *) echo "features responded $code"; exit 1 ;;
          esac
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 100
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 20m
          memory: 32Mi
---
# Source: pds/templates/backup-storage-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: pds-backup-storage
  namespace: everest-system
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/component: minio
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        helm.sh/chart: pds-0.1.0
        app.kubernetes.io/name: pds
        app.kubernetes.io/instance: pds
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pds
        app.kubernetes.io/component: minio
    spec:
      restartPolicy: OnFailure
      priorityClassName: pds-bulk
      serviceAccountName: pds-backup-storage
      containers:
        - name: apply
          image: "alpine/k8s:1.32.3"
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_NAMESPACE
              value: "pds"
            - name: MINIO_ENDPOINT
              value: "http://minio.everest-system.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "pds-backups"
            - name: STORAGE_NAME
              value: "minio"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              deadline=$(( $(date +%s) + 600 ))
              while ! kubectl get namespace "${DB_NAMESPACE}" >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "${deadline}" ]; then
                  echo "namespace ${DB_NAMESPACE} did not appear in time"
                  exit 1
                fi
                sleep 5
              done
              while ! kubectl get crd backupstorages.backup.openeverest.io >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "${deadline}" ]; then
                  echo "BackupStorage CRD did not appear in time"
                  exit 1
                fi
                sleep 5
              done
              kubectl -n "${DB_NAMESPACE}" create secret generic minio-backup \
                --from-literal=AWS_ACCESS_KEY_ID="${MINIO_ROOT_USER}" \
                --from-literal=AWS_SECRET_ACCESS_KEY="${MINIO_ROOT_PASSWORD}" \
                --dry-run=client -o yaml | kubectl apply -f -
              cat <<EOF | kubectl apply -f -
              apiVersion: backup.openeverest.io/v1alpha1
              kind: BackupStorage
              metadata:
                name: ${STORAGE_NAME}
                namespace: ${DB_NAMESPACE}
              spec:
                type: s3
                s3:
                  bucket: ${MINIO_BUCKET}
                  region: us-east-1
                  endpointURL: ${MINIO_ENDPOINT}
                  credentialsSecretRef:
                    name: minio-backup
                  forcePathStyle: true
                  verifyTLS: false
              EOF
---

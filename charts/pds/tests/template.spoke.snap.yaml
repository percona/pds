apiVersion: batch/v1
kind: Job
metadata:
  name: pds-everest-token
  namespace: everest-system
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/component: adapter
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "25"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        helm.sh/chart: pds-0.1.0
        app.kubernetes.io/name: pds
        app.kubernetes.io/instance: pds
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pds
        app.kubernetes.io/component: adapter
    spec:
      restartPolicy: OnFailure
      priorityClassName: pds-bulk
      serviceAccountName: pds-everest-token
      containers:
        - name: mint
          image: "alpine/k8s:1.32.3"
          imagePullPolicy: IfNotPresent
          env:
            - name: EVEREST_URL
              value: "http://everest.everest-system.svc.cluster.local:8080"
            - name: TOKEN_SECRET
              value: "pds-everest"
            - name: ACCOUNTS_SECRET
              value: "everest-accounts"
            - name: ADAPTER_DEPLOYMENT
              value: "pds-adapter"
            - name: NAMESPACE
              value: "everest-system"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              deadline=$(( $(date +%s) + 600 ))
              while true; do
                if [ "$(date +%s)" -ge "${deadline}" ]; then
                  echo "everest did not answer in time"
                  exit 1
                fi
                code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 \
                  "${EVEREST_URL}/v1/version" || true)"
                case "${code}" in
                  200|401) break ;;
                esac
                sleep 5
              done
              users="$(kubectl -n "${NAMESPACE}" get secret "${ACCOUNTS_SECRET}" \
                -o jsonpath='{.data.users\.yaml}' | base64 -d)"
              pass="$(printf '%s\n' "${users}" | awk '$1 == "passwordHash:" { print $2; exit }')"
              if [ -z "${pass}" ]; then
                echo "${ACCOUNTS_SECRET} has no admin password"
                exit 1
              fi
              session="$(curl --silent --show-error --max-time 15 \
                -X POST "${EVEREST_URL}/v1/auth/token" \
                -H 'Content-Type: application/json' \
                -d "{\"grant_type\":\"password\",\"username\":\"admin\",\"password\":\"${pass}\"}")"
              token="$(printf '%s' "${session}" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
              if [ -z "${token}" ]; then
                echo "POST /v1/auth/token returned no token"
                exit 1
              fi
              kubectl -n "${NAMESPACE}" create secret generic "${TOKEN_SECRET}" \
                --from-literal="EVEREST_TOKEN=${token}" \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl -n "${NAMESPACE}" rollout restart "deployment/${ADAPTER_DEPLOYMENT}"

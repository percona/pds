                  key: SN_CLIENT_TOKEN
                  optional: true
            - name: SN_SECRET_NAME
              value: "pds-servicenow"
            - name: ASSISTANT_SECRET_NAME
              value: "pds-assistant"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:

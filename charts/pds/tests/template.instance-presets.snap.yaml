# Source: pds/templates/instance-presets.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: pds-instance-presets
  namespace: everest-system
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/component: instance-preset
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "16"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        helm.sh/chart: pds-0.1.0
        app.kubernetes.io/name: pds
        app.kubernetes.io/instance: pds
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pds
        app.kubernetes.io/component: instance-preset
    spec:
      restartPolicy: OnFailure
      priorityClassName: pds-bulk
      serviceAccountName: pds-instance-presets
      containers:
        - name: apply
          image: "alpine/k8s:1.32.3"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              deadline=$(( $(date +%s) + 600 ))
              while ! kubectl get crd instancepresets.core.openeverest.io >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "${deadline}" ]; then
                  echo "InstancePreset CRD did not appear in time"
                  exit 1
                fi
                sleep 5
              done
              cat <<EOF | kubectl apply -f -


              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-mysql-dev
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: mysql
                  pds.percona.com/profile: dev
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: percona-xtradb-cluster
                topology:
                  type: cluster
                components:
                  engine:

                    replicas: 1
                    resources:
                      limits:
                        cpu: "1"
                        memory: 2Gi
                    storage:
                      size: 20Gi
                  proxy:
                    type: haproxy
                    replicas: 1

              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-mysql-staging
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: mysql
                  pds.percona.com/profile: staging
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: percona-xtradb-cluster
                topology:
                  type: cluster
                components:
                  engine:

                    replicas: 3
                    resources:
                      limits:
                        cpu: "2"
                        memory: 8Gi
                    storage:
                      size: 100Gi
                  proxy:
                    type: haproxy
                    replicas: 3

              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-mysql-prod
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: mysql
                  pds.percona.com/profile: prod
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: percona-xtradb-cluster
                topology:
                  type: cluster
                components:
                  engine:

                    replicas: 3
                    resources:
                      limits:
                        cpu: "4"
                        memory: 16Gi
                    storage:
                      size: 250Gi
                  proxy:
                    type: haproxy
                    replicas: 3



              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-postgresql-dev
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: postgresql
                  pds.percona.com/profile: dev
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: provider-percona-postgresql
                topology:
                  type: cluster
                components:
                  engine:

                    type: postgresql

                    replicas: 1
                    resources:
                      limits:
                        cpu: "1"
                        memory: 2Gi
                    storage:
                      size: 20Gi
                  proxy:
                    type: pgbouncer
                    replicas: 1

              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-postgresql-staging
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: postgresql
                  pds.percona.com/profile: staging
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: provider-percona-postgresql
                topology:
                  type: cluster
                components:
                  engine:

                    type: postgresql

                    replicas: 3
                    resources:
                      limits:
                        cpu: "2"
                        memory: 8Gi
                    storage:
                      size: 100Gi
                  proxy:
                    type: pgbouncer
                    replicas: 3

              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-postgresql-prod
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: postgresql
                  pds.percona.com/profile: prod
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: provider-percona-postgresql
                topology:
                  type: cluster
                components:
                  engine:

                    type: postgresql

                    replicas: 3
                    resources:
                      limits:
                        cpu: "4"
                        memory: 16Gi
                    storage:
                      size: 250Gi
                  proxy:
                    type: pgbouncer
                    replicas: 3



              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-mongodb-dev
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: mongodb
                  pds.percona.com/profile: dev
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: percona-server-mongodb
                topology:
                  type: replicaSet
                components:
                  engine:

                    replicas: 1
                    resources:
                      limits:
                        cpu: "1"
                        memory: 2Gi
                    storage:
                      size: 20Gi

              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-mongodb-staging
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: mongodb
                  pds.percona.com/profile: staging
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: percona-server-mongodb
                topology:
                  type: replicaSet
                components:
                  engine:

                    replicas: 3
                    resources:
                      limits:
                        cpu: "2"
                        memory: 8Gi
                    storage:
                      size: 100Gi

              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-mongodb-prod
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: mongodb
                  pds.percona.com/profile: prod
                annotations:
                  pds.percona.com/preset-version: "1"
              spec:
                providerRef:
                  name: percona-server-mongodb
                topology:
                  type: replicaSet
                components:
                  engine:

                    replicas: 3
                    resources:
                      limits:
                        cpu: "4"
                        memory: 16Gi
                    storage:
                      size: 250Gi


              EOF

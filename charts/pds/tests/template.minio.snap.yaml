---
# Source: pds/templates/minio.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: everest-system
  labels:
    helm.sh/chart: pds-0.1.0
    app.kubernetes.io/name: pds
    app.kubernetes.io/instance: pds
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pds
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  # One writer owns the volume, so the old pod has to release it before the new
  # one starts. A rolling update would deadlock waiting on a claim that is still
  # attached.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pds
      app.kubernetes.io/instance: pds
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        helm.sh/chart: pds-0.1.0
        app.kubernetes.io/name: pds
        app.kubernetes.io/instance: pds
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: pds
        app.kubernetes.io/component: minio
    spec:
      priorityClassName: pds-bulk
      containers:
        - name: minio
          # Official minio repositories reject anonymous pulls.
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          args:
            - server
            - /data
            - --console-address
            - :9001
          envFrom:
            - secretRef:
                name: minio-root
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data

apiVersion: v1
kind: Service
metadata:
  name: {{ include "pds.adapter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: adapter
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.adapter.service.type }}
  ports:
    - name: http
      port: {{ .Values.adapter.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pds.selectorLabels" (dict "root" . "component" "adapter") | nindent 4 }}

{{- if or .Values.stack.enabled .Values.adapter.installInstancePresets }}
{{- /*
  Cluster-scoped Percona Database Service InstancePresets. Create maps Dev, Staging, and Prod
  onto these names and refuses the request when a live object is missing,
  incompatible, or no longer this generation. A Job applies them after the
  InstancePreset CRD exists, the same way BackupStorage is installed.
*/}}
{{- $name := include "pds.fullname" . }}
{{- $version := "1" }}
{{- $engines := list
  (dict "id" "mysql" "provider" "percona-xtradb-cluster" "topology" "cluster" "engineType" "" "proxyType" "haproxy")
  (dict "id" "postgresql" "provider" "provider-percona-postgresql" "topology" "cluster" "engineType" "postgresql" "proxyType" "pgbouncer")
  (dict "id" "mongodb" "provider" "percona-server-mongodb" "topology" "replicaSet" "engineType" "" "proxyType" "")
}}
{{- $profiles := list
  (dict "name" "dev" "replicas" 1 "cpu" "1" "memory" "2Gi" "storage" "20Gi")
  (dict "name" "staging" "replicas" 3 "cpu" "2" "memory" "8Gi" "storage" "100Gi")
  (dict "name" "prod" "replicas" 3 "cpu" "4" "memory" "16Gi" "storage" "250Gi")
}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-instance-presets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance-preset
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-instance-presets
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance-preset
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["core.openeverest.io"]
    resources: ["instancepresets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-instance-presets
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance-preset
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-instance-presets
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-instance-presets
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-instance-presets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance-preset
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "16"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        {{- include "pds.labels" . | nindent 8 }}
        app.kubernetes.io/component: instance-preset
    spec:
      restartPolicy: OnFailure
      priorityClassName: pds-bulk
      serviceAccountName: {{ $name }}-instance-presets
      containers:
        - name: apply
          image: "{{ .Values.stack.applyImage.repository }}:{{ .Values.stack.applyImage.tag }}"
          imagePullPolicy: {{ .Values.stack.applyImage.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              deadline=$(( $(date +%s) + 600 ))
              while ! kubectl get crd instancepresets.core.openeverest.io >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "${deadline}" ]; then
                  echo "InstancePreset CRD did not appear in time"
                  exit 1
                fi
                sleep 5
              done
              cat <<EOF | kubectl apply -f -
{{ range $engine := $engines }}
{{ range $profile := $profiles }}
              ---
              apiVersion: core.openeverest.io/v1alpha1
              kind: InstancePreset
              metadata:
                name: pds-{{ $engine.id }}-{{ $profile.name }}
                labels:
                  app.kubernetes.io/component: instance-preset
                  pds.percona.com/engine: {{ $engine.id }}
                  pds.percona.com/profile: {{ $profile.name }}
                annotations:
                  pds.percona.com/preset-version: {{ $version | quote }}
              spec:
                providerRef:
                  name: {{ $engine.provider }}
                topology:
                  type: {{ $engine.topology }}
                components:
                  engine:
{{ if $engine.engineType }}
                    type: {{ $engine.engineType }}
{{ end }}
                    replicas: {{ $profile.replicas }}
                    resources:
                      limits:
                        cpu: {{ $profile.cpu | quote }}
                        memory: {{ $profile.memory }}
                    storage:
                      size: {{ $profile.storage }}
{{- if $engine.proxyType }}
                  proxy:
                    type: {{ $engine.proxyType }}
                    replicas: {{ $profile.replicas }}
{{- end }}
{{ end }}
{{ end }}
              EOF
{{- end }}

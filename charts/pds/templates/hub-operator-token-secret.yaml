{{- if and .Values.adapter.hub.operatorToken (not .Values.adapter.hub.operatorTokenExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pds.hub.operatorTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: adapter
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.adapter.hub.operatorTokenKey | default "HUB_OPERATOR_TOKEN" }}: {{ .Values.adapter.hub.operatorToken | quote }}
{{- end }}

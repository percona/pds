{{/*
The PMM admin password is minted by a hook Job rather than rendered into the
release, for the same reason as the state key: a password generated at render
time differs on every helm template and every upgrade, while PMM keeps the one
it first started with on its volume.

It runs before install because pmm-0 reads this Secret at start and does not
start without it, and a helm install that waits for pmm-0 would otherwise wait
forever.
*/}}
{{- if include "pds.stackPMM" . }}
{{- $hook := printf "%s-pmm-admin" (include "pds.fullname" .) }}
{{- $secret := include "pds.pmm.adminSecretName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hook }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $hook }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  # get on the one name, create with no resourceNames because the first write
  # of a named object cannot use them. There is no update: PMM keeps the
  # password it started with, so replacing it would lock the hook out.
  # patch only adds the keep policy to a Secret the subchart once rendered.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $secret | quote }}
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $hook }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $hook }}
subjects:
  - kind: ServiceAccount
    name: {{ $hook }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hook }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        {{- include "pds.labels" . | nindent 8 }}
        app.kubernetes.io/component: monitoring
    spec:
      restartPolicy: OnFailure
      # No priorityClassName. This runs as a pre-install hook, and the chart's
      # PriorityClass is an ordinary release resource that does not exist yet.
      serviceAccountName: {{ $hook }}
      containers:
        - name: mint
          image: "{{ .Values.stack.applyImage.repository }}:{{ .Values.stack.applyImage.tag }}"
          imagePullPolicy: {{ .Values.stack.applyImage.pullPolicy }}
          env:
            - name: SECRET_NAME
              value: {{ $secret | quote }}
            - name: SECRET_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if kubectl get secret "${SECRET_NAME}" -n "${SECRET_NAMESPACE}" >/dev/null 2>&1; then
                # A release installed while the subchart rendered this Secret
                # owns it, and the upgrade that stops rendering it would delete
                # it and leave pmm-0 unable to start. Helm skips a resource
                # marked keep.
                owner="$(kubectl get secret "${SECRET_NAME}" -n "${SECRET_NAMESPACE}" \
                  -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}')"
                if [ "${owner}" = "Helm" ]; then
                  kubectl annotate secret "${SECRET_NAME}" -n "${SECRET_NAMESPACE}" \
                    helm.sh/resource-policy=keep --overwrite >/dev/null
                  echo "kept the PMM admin password the subchart created"
                fi
                echo "the PMM admin password is already present, leaving it as it is"
                exit 0
              fi
              # The password is piped straight into kubectl and never echoed,
              # so it does not land in the Job log.
              pass="$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
              # create, not apply: a Job that raced this one must not replace
              # a password PMM has already started with.
              if printf '%s' "${pass}" | kubectl create secret generic "${SECRET_NAME}" \
                -n "${SECRET_NAMESPACE}" --from-file="PMM_ADMIN_PASSWORD=/dev/stdin"; then
                echo "minted the PMM admin password"
              elif kubectl get secret "${SECRET_NAME}" -n "${SECRET_NAMESPACE}" >/dev/null 2>&1; then
                echo "another run minted the PMM admin password first, leaving it as it is"
              else
                echo "could not mint the PMM admin password"
                exit 1
              fi
{{- end }}

{{- if and .Values.servicenow.enabled (not .Values.servicenow.existingSecret) }}
{{- if not .Values.servicenow.apiKey }}
{{- fail "servicenow.apiKey is required when servicenow.enabled is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pds.servicenow.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: adapter
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  SN_API_KEY: {{ .Values.servicenow.apiKey | quote }}
  {{- with .Values.servicenow.clientToken }}
  SN_CLIENT_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}

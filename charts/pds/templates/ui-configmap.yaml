{{- if and .Values.ui.enabled .Values.ui.nginxConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pds.ui.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Serves the built SPA and proxies /api to the adapter, so the browser only
  # ever talks to one origin and the adapter needs no CORS handling.
  default.conf: |
    # The combined format logs $request and $http_referer, and both can carry
    # the claim URL. A claim link and the invite call put a single-use token in
    # that query, and the browser sends the claim URL as Referer on the next
    # same-origin request. Log the path only.
    log_format notoken '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

    # HSTS is only for the public site. An empty value adds no header, so
    # every other host is left alone. X-Forwarded-Host covers an edge that
    # rewrites Host and still records the name the browser used.
    map "$host,$http_x_forwarded_host" $pds_hsts {
      default "";
      "~(^|,)pds\.percona\.com(,|$)" "max-age=31536000";
    }

    server {
      access_log /var/log/nginx/access.log notoken;
      listen {{ .Values.ui.service.port }};
      server_name _;
      server_tokens off;
      # Redirects carry a path only. nginx would otherwise build them from its
      # own port, which the ingress, port-forward or TLS proxy in front of it
      # does not use.
      absolute_redirect off;
      # A location with its own add_header drops these, so those locations
      # repeat them.
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security $pds_hsts always;
      {{- if .Values.ui.landingPage }}

      # The image holds two builds: the public landing page in landing/ and the
      # console in app/. The root serves the landing page and the console
      # lives under /app/.
      root /usr/share/nginx/html/landing;
      {{- else }}

      # The console is built under /app/. The public landing page is only
      # served by the hosted deployment, so the root sends people to the
      # console here.
      root /usr/share/nginx/html;
      {{- end }}
      index index.html;

      # Probe target that does not depend on the SPA build output.
      location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $pds_hsts always;
        return 200 "ok";
      }

      location /api/ {
        proxy_pass {{ include "pds.adapter.url" . }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat waits on an upstream model for up to 165s.
        # The adapter write timeout is 180s; keep this at or above that. A
        # streamed chat turn sends X-Accel-Buffering: no, so its events are not
        # held here, and a heartbeat every 10s keeps it from reading as idle.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
      }

      # The authorization server agents sign in through. It lives on the same
      # origin as /api, so the metadata an agent reads names this host.
      location /oauth/ {
        proxy_pass {{ include "pds.adapter.url" . }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
      }

      location = /.well-known/oauth-authorization-server {
        proxy_pass {{ include "pds.adapter.url" . }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /.well-known/oauth-protected-resource {
        proxy_pass {{ include "pds.adapter.url" . }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # The MCP endpoint agents use once signed in. The adapter answers
      # without buffering, and the bearer token passes through untouched.
      location = /mcp {
        proxy_pass {{ include "pds.adapter.url" . }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
      }

      location /mcp/ {
        proxy_pass {{ include "pds.adapter.url" . }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
      }

      {{- if not .Values.ui.landingPage }}

      location = / {
        return 302 /app/;
      }
      {{- end }}

      location = /app {
        return 301 /app/;
      }

      # The shell names the hashed script of the current build, so a browser
      # that keeps an old copy keeps loading the previous release. no-cache
      # still allows a cached copy, but only after the server says it is
      # unchanged. The hashed assets under assets/ never change and may be kept.
      location = /app/index.html {
        {{- if .Values.ui.landingPage }}
        root /usr/share/nginx/html;
        {{- end }}
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $pds_hsts always;
      }

      location /app/ {
        {{- if .Values.ui.landingPage }}
        root /usr/share/nginx/html;
        {{- end }}
        try_files $uri $uri/ /app/index.html;
      }

      # Console pages from before the console moved under /app/. Bookmarks and
      # invite links already sent keep working; the query, and with it a claim
      # token, travels in $request_uri.
      location ~ ^/(login|claim|databases|clusters|activity|support|health|chat)(/|$) {
        return 301 /app$request_uri;
      }

      {{- if .Values.ui.landingPage }}

      # The landing page's shell, for the same reason as the console's.
      location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $pds_hsts always;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
      {{- else }}

      # Nothing else in the web root is for this install: the image also holds
      # nginx's stock page and the hosted landing page.
      location / {
        return 404;
      }
      {{- end }}
    }
{{- end }}

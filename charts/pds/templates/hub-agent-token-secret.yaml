{{- if and .Values.adapter.hub.agentToken (not .Values.adapter.hub.agentTokenExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pds.hub.agentTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pds.labels" . | nindent 4 }}
    app.kubernetes.io/component: adapter
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.adapter.hub.agentTokenKey | default "HUB_AGENT_TOKEN" }}: {{ .Values.adapter.hub.agentToken | quote }}
{{- end }}

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# The release is a GitHub Release tagged mcp-v1.2.3, which GoReleaser does not read as a
# version, so the workflow passes the version in PDS_MCP_VERSION and the names below use it.
# GoReleaser builds and signs; publish-mcp.yml attaches the files and publishes to npm.
project_name: pds-mcp

dist: dist/goreleaser

builds:
  - id: pds-mcp
    main: ./cmd/pds-mcp
    binary: pds-mcp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Env.PDS_MCP_VERSION }}

archives:
  - formats: [binary]
    name_template: "pds-mcp_{{ .Env.PDS_MCP_VERSION }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "pds-mcp_{{ .Env.PDS_MCP_VERSION }}_checksums.txt"
  algorithm: sha256

# One keyless signature over the checksum file covers every binary it lists.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

changelog:
  disable: true

release:
  disable: true

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pds
  namespace: flux-system
spec:
  chart:
    spec:
      chart: pds
      sourceRef:
        kind: HelmRepository
        name: pds-charts
      version: 0.1.0
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: pds
  serviceAccountName: pds-helm
  storageNamespace: everest-system
  targetNamespace: everest-system
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      retries: 1
  values:
    adapter:
      database:
        enabled: false
        operator:
          enabled: false
      everestBackupStorage: ""
      everestURL: http://everest.everest-system.svc.cluster.local:8080
      hub:
        agentTokenExistingSecret: pds-hub-agent-token
        environmentName: orders
        url: https://hub.example
      image:
        repository: ghcr.io/percona/pds-adapter
        tag: 0.1.0
      installInstancePresets: true
      role: agent
    openeverest:
      upgrade:
        preflightChecks: false
    stack:
      enabled: true
      pmm:
        subchart: false
    ui:
      enabled: false
      replicaCount: 0

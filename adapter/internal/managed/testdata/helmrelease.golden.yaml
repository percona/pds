apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pds
  namespace: flux-system
spec:
  chart:
    spec:
      chart: pds
      sourceRef:
        kind: HelmRepository
        name: pds-charts
      version: 0.1.0
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: pds
  serviceAccountName: pds-helm
  storageNamespace: everest-system
  targetNamespace: everest-system
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      retries: 0
      strategy: rollback
  values:
    adapter:
      database:
        enabled: false
        operator:
          enabled: false
      everestBackupStorage: s3
      everestURL: http://everest.everest-system.svc.cluster.local:8080
      hub:
        agentTokenExistingSecret: pds-hub-agent-token
        environmentName: orders
        releaseRef: flux-system/pds
        url: https://hub.example
      image:
        repository: ghcr.io/percona/pds-adapter
        tag: 0.1.0
      installInstancePresets: true
      role: agent
    openeverest:
      upgrade:
        preflightChecks: false
    stack:
      enabled: true
      minio:
        enabled: false
      pmm:
        subchart: false
      s3:
        bucket: pds-111122223333-0123456789ab
        enabled: true
        existingSecret: pds-s3
        region: eu-west-1
        storageName: s3
    taggedStorageClass:
      enabled: true
      tags:
        percona.com/pds: 0123456789ab
    ui:
      enabled: false
      replicaCount: 0

# Source of truth for the Percona Database Service and OpenEverest compatibility unit.
# Chart.yaml dependencies, values.yaml platform.*, and docs/compatibility.md
# must match this file. Bump every field in one PR. Mixed component versions
# are not a supported product.
schema: 1

support:
  # Design-partner preview: fresh cluster installs only.
  freshInstall: supported
  upgrade: unsupported
  # The oldest installed version an in-place update (the join script's
  # --update) starts from, per component: openeverest, pxc or postgresql.
  # OpenEverest 2.0.0-dev.3 has no upgrade path. A later pin bump adds a floor
  # only when it knows a transition breaks.
  update:
    from:
      openeverest: ">= 2.0.0-dev.4"
  # The versions the control plane may move a managed environment's pds
  # release to, keyed by the version the environment runs. A version with no
  # entry has no managed upgrade. Separate from update above, which is the join
  # script's in-place update of a Connect environment.
  managedUpgrade:
    from: {}

kubernetes:
  min: ">= 1.27.0-0"

pds:
  chart: "0.1.0"
  app: "0.1.0"

# The Flux release the join script installs and a managed environment
# bootstraps with.
flux:
  version: "2.5.1"

# The managed environment CloudFormation templates are stamped with this
# revision. cutFor holds the versions the revision was last reviewed against.
# Changing the chart or Flux version fails the check until revision is bumped,
# or cutFor is moved to the new versions to leave the revision as it is.
managedTemplate:
  revision: 2
  cutFor:
    chart: "0.1.0"
    flux: "2.5.1"

openeverest:
  name: openeverest
  repository: https://openeverest.github.io/helm-charts/
  version: "2.0.0-dev.4"

providers:
  pxc:
    name: provider-percona-xtradb-cluster
    alias: provider-pxc
    repository: oci://ghcr.io/openeverest/charts
    version: "0.3.1"
    operator: "1.20.0"
  postgresql:
    name: provider-percona-postgresql
    alias: provider-postgresql
    repository: oci://ghcr.io/openeverest/charts
    version: "0.6.0"
    operator: "3.0.0"

pmm:
  name: pmm
  repository: https://percona.github.io/percona-helm-charts/
  version: "1.9.1"
  app: "3.9.1"

crds:
  instance: core.openeverest.io/v1alpha1
  backup: backup.openeverest.io/v1alpha1

databases:
  mysql:
    engine: Percona XtraDB Cluster
    versionSource: operator-default
  postgresql:
    engine: Percona PostgreSQL
    versionSource: operator-default

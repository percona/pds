AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets the Percona Database Service control plane build and keep Kubernetes
  environments in this AWS account. Created by the connect command, which
  turns on termination protection. Delete the environments before the stack.

Parameters:
  ConnectionId:
    Type: String
    Description: The connection's id, given by the connect command.
    AllowedPattern: "^[0-9a-f]{12}$"
    ConstraintDescription: Use the id the connect command prints.
  ExternalId:
    Type: String
    NoEcho: true
    Description: The secret the control plane presents when it assumes the role.
    AllowedPattern: "^[A-Za-z0-9]{32,64}$"
    ConstraintDescription: Use the value the connect command prints.
  ControlPlanePrincipalArn:
    Type: String
    Description: The role the control plane assumes from. It is never an account root.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:(role|user)/[A-Za-z0-9+=,.@_/-]+$"
    ConstraintDescription: Use a role or user ARN, not an account root.
  AllowedRegions:
    Type: CommaDelimitedList
    Description: The regions environments may be built in.

Resources:
  ControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "pds-${ConnectionId}-control-plane"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - Ref: CleanupPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # sts:ExternalId is only in the context AWS evaluates sts:AssumeRole
          # in, so SetSourceIdentity is granted in a statement of its own.
          - Effect: Allow
            Principal:
              AWS:
                Ref: ControlPlanePrincipalArn
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId":
                  Ref: ExternalId
              StringLike:
                "sts:SourceIdentity":
                  - "pds-user-*"
                  - "pds-job-*"
          - Effect: Allow
            Principal:
              AWS:
                Ref: ControlPlanePrincipalArn
            Action: "sts:SetSourceIdentity"
            Condition:
              StringLike:
                "sts:SourceIdentity":
                  - "pds-user-*"
                  - "pds-job-*"
      Policies:
        - PolicyName: drive-stacks-and-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartEnvironmentStacksThroughTheServiceRole
                Effect: Allow
                Action:
                  - "cloudformation:CreateStack"
                  - "cloudformation:UpdateStack"
                  - "cloudformation:CreateChangeSet"
                Resource:
                  Fn::Sub: "arn:aws:cloudformation:*:${AWS::AccountId}:stack/pds-*/*"
                Condition:
                  StringEquals:
                    "cloudformation:RoleArn":
                      Fn::GetAtt: [ServiceRole, Arn]
                    "aws:RequestedRegion":
                      Ref: AllowedRegions
              # These calls carry no role: CloudFormation uses the one the stack
              # was made with. A condition on the role would refuse every call.
              - Sid: FinishAndRemoveEnvironmentStacks
                Effect: Allow
                Action:
                  - "cloudformation:DeleteStack"
                  - "cloudformation:ExecuteChangeSet"
                  - "cloudformation:DeleteChangeSet"
                Resource:
                  Fn::Sub: "arn:aws:cloudformation:*:${AWS::AccountId}:stack/pds-*/*"
                Condition:
                  StringEquals:
                    "aws:RequestedRegion":
                      Ref: AllowedRegions
              - Sid: ReadStacks
                Effect: Allow
                Action:
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:DescribeStackEvents"
                  - "cloudformation:DescribeStackResources"
                  - "cloudformation:DescribeChangeSet"
                  - "cloudformation:GetTemplate"
                  - "cloudformation:ListStackResources"
                  - "cloudformation:DetectStackDrift"
                  - "cloudformation:DescribeStackResourceDrifts"
                Resource:
                  Fn::Sub: "arn:aws:cloudformation:*:${AWS::AccountId}:stack/pds-*/*"
              - Sid: ReadTheOutcomeOfADriftCheck
                Effect: Allow
                Action: "cloudformation:DescribeStackDriftDetectionStatus"
                Resource: "*"
              - Sid: NeverTouchThisStack
                Effect: Deny
                Action:
                  - "cloudformation:UpdateStack"
                  - "cloudformation:DeleteStack"
                  - "cloudformation:CreateChangeSet"
                  - "cloudformation:ExecuteChangeSet"
                  - "cloudformation:DeleteChangeSet"
                  - "cloudformation:UpdateTerminationProtection"
                Resource:
                  Fn::Sub: "arn:aws:cloudformation:*:${AWS::AccountId}:stack/pds-${ConnectionId}/*"
              - Sid: HandTheServiceRoleToCloudFormation
                Effect: Allow
                Action: "iam:PassRole"
                Resource:
                  Fn::GetAtt: [ServiceRole, Arn]
                Condition:
                  StringEquals:
                    "iam:PassedToService": "cloudformation.amazonaws.com"
              - Sid: OpenTheAccessWindowOnOwnedClusters
                Effect: Allow
                Action:
                  - "eks:UpdateClusterConfig"
                  - "eks:CreateAccessEntry"
                Resource:
                  Fn::Sub: "arn:aws:eks:*:${AWS::AccountId}:cluster/pds-*"
                Condition:
                  "Null":
                    "aws:ResourceTag/percona.com/pds": "false"
                  StringEquals:
                    "aws:RequestedRegion":
                      Ref: AllowedRegions
              # An access entry is made with no tags, so it is named by its
              # cluster instead of by a tag it does not carry.
              - Sid: CloseTheAccessWindowOnOwnedClusters
                Effect: Allow
                Action:
                  - "eks:DeleteAccessEntry"
                  - "eks:UpdateAccessEntry"
                  - "eks:AssociateAccessPolicy"
                  - "eks:DisassociateAccessPolicy"
                Resource:
                  Fn::Sub: "arn:aws:eks:*:${AWS::AccountId}:access-entry/pds-*/*"
                Condition:
                  StringEquals:
                    "aws:RequestedRegion":
                      Ref: AllowedRegions
              - Sid: ReadWhatThePreflightAndTheCheckNeed
                Effect: Allow
                Action:
                  - "iam:GetRole"
                  - "ec2:Describe*"
                  - "eks:Describe*"
                  - "eks:List*"
                  - "elasticloadbalancing:Describe*"
                  - "servicequotas:GetServiceQuota"
                  - "servicequotas:ListServiceQuotas"
                  - "account:ListRegions"
                  - "tag:GetResources"
                Resource: "*"
      Tags:
        - Key: "percona.com/pds-connection"
          Value:
            Ref: ConnectionId

  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "pds-${ConnectionId}-cloudformation"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "cloudformation.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - Ref: NetworkPolicy
        - Ref: EksPolicy
        - Ref: IamPolicy
      Tags:
        - Key: "percona.com/pds-connection"
          Value:
            Ref: ConnectionId

  NetworkPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: "pds-${ConnectionId}-network"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CreateNetworkResourcesWithTheOwnershipTag
            Effect: Allow
            Action:
              - "ec2:CreateVpc"
              - "ec2:CreateInternetGateway"
              - "ec2:CreateSubnet"
              - "ec2:CreateRouteTable"
              - "ec2:CreateSecurityGroup"
              - "ec2:CreateNatGateway"
              - "ec2:AllocateAddress"
            Resource:
              - Fn::Sub: "arn:aws:ec2:*:${AWS::AccountId}:vpc/*"
              - Fn::Sub: "arn:aws:ec2:*:${AWS::AccountId}:internet-gateway/*"
              - Fn::Sub: "arn:aws:ec2:*:${AWS::AccountId}:subnet/*"
              - Fn::Sub: "arn:aws:ec2:*:${AWS::AccountId}:route-table/*"
              - Fn::Sub: "arn:aws:ec2:*:${AWS::AccountId}:security-group/*"
              - Fn::Sub: "arn:aws:ec2:*:${AWS::AccountId}:natgateway/*"
              - Fn::Sub: "arn:aws:ec2:*:${AWS::AccountId}:elastic-ip/*"
            Condition:
              "Null":
                "aws:RequestTag/percona.com/pds": "false"
              StringEquals:
                "aws:RequestedRegion":
                  Ref: AllowedRegions
          - Sid: CreateInsideTheOwnedVpc
            Effect: Allow
            Action:
              - "ec2:CreateSubnet"
              - "ec2:CreateRouteTable"
              - "ec2:CreateSecurityGroup"
            Resource:
              Fn::Sub: "arn:aws:ec2:*:${AWS::AccountId}:vpc/*"
            Condition:
              "Null":
                "aws:ResourceTag/percona.com/pds": "false"
              StringEquals:
                "aws:RequestedRegion":
                  Ref: AllowedRegions
          - Sid: TagOnlyWhileCreating
            Effect: Allow
            Action: "ec2:CreateTags"
            Resource: "*"
            Condition:
              StringEquals:
                "ec2:CreateAction":
                  - "CreateVpc"
                  - "CreateInternetGateway"
                  - "CreateSubnet"
                  - "CreateRouteTable"
                  - "CreateSecurityGroup"
                  - "CreateNatGateway"
                  - "AllocateAddress"
                "aws:RequestedRegion":
                  Ref: AllowedRegions
              "Null":
                "aws:RequestTag/percona.com/pds": "false"
          - Sid: ChangeOwnedNetworkResources
            Effect: Allow
            Action:
              - "ec2:AttachInternetGateway"
              - "ec2:DetachInternetGateway"
              - "ec2:DeleteInternetGateway"
              - "ec2:ModifyVpcAttribute"
              - "ec2:DeleteVpc"
              - "ec2:ModifySubnetAttribute"
              - "ec2:DeleteSubnet"
              - "ec2:AssociateRouteTable"
              - "ec2:DisassociateRouteTable"
              - "ec2:CreateRoute"
              - "ec2:DeleteRoute"
              - "ec2:DeleteRouteTable"
              - "ec2:AuthorizeSecurityGroupIngress"
              - "ec2:AuthorizeSecurityGroupEgress"
              - "ec2:RevokeSecurityGroupIngress"
              - "ec2:RevokeSecurityGroupEgress"
              - "ec2:DeleteSecurityGroup"
              - "ec2:DeleteNatGateway"
              - "ec2:ReleaseAddress"
              - "ec2:AssociateAddress"
              - "ec2:DisassociateAddress"
            Resource: "*"
            Condition:
              "Null":
                "aws:ResourceTag/percona.com/pds": "false"
              StringEquals:
                "aws:RequestedRegion":
                  Ref: AllowedRegions
          - Sid: ReadTheNetwork
            Effect: Allow
            Action: "ec2:Describe*"
            Resource: "*"

  EksPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: "pds-${ConnectionId}-eks"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CreateEksResourcesWithTheOwnershipTag
            Effect: Allow
            Action:
              - "eks:CreateCluster"
              - "eks:CreateNodegroup"
              - "eks:CreateAddon"
              - "eks:CreatePodIdentityAssociation"
            Resource: "*"
            Condition:
              "Null":
                "aws:RequestTag/percona.com/pds": "false"
              StringEquals:
                "aws:RequestedRegion":
                  Ref: AllowedRegions
          - Sid: ChangeOwnedEksResources
            Effect: Allow
            Action:
              - "eks:DeleteCluster"
              - "eks:UpdateClusterConfig"
              - "eks:UpdateClusterVersion"
              - "eks:DeleteNodegroup"
              - "eks:UpdateNodegroupConfig"
              - "eks:UpdateNodegroupVersion"
              - "eks:DeleteAddon"
              - "eks:UpdateAddon"
              - "eks:DeletePodIdentityAssociation"
              - "eks:UpdatePodIdentityAssociation"
              - "eks:CreateAccessEntry"
              - "eks:DeleteAccessEntry"
              - "eks:UpdateAccessEntry"
              - "eks:AssociateAccessPolicy"
              - "eks:DisassociateAccessPolicy"
            Resource: "*"
            Condition:
              "Null":
                "aws:ResourceTag/percona.com/pds": "false"
              StringEquals:
                "aws:RequestedRegion":
                  Ref: AllowedRegions
          - Sid: NeverRetagWhatExists
            Effect: Deny
            Action:
              - "eks:TagResource"
              - "eks:UntagResource"
            Resource: "*"
          - Sid: ReadEks
            Effect: Allow
            Action:
              - "eks:Describe*"
              - "eks:List*"
            Resource: "*"

  IamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: "pds-${ConnectionId}-iam"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HandTheConnectionsRolesToTheirServices
            Effect: Allow
            Action: "iam:PassRole"
            Resource:
              - Fn::GetAtt: [EksClusterRole, Arn]
              - Fn::GetAtt: [NodeRole, Arn]
              - Fn::GetAtt: [EbsCsiRole, Arn]
              - Fn::GetAtt: [AgentRole, Arn]
            Condition:
              StringEquals:
                "iam:PassedToService":
                  - "eks.amazonaws.com"
                  - "ec2.amazonaws.com"
                  - "pods.eks.amazonaws.com"
          - Sid: LetAwsMakeItsOwnServiceLinkedRoles
            Effect: Allow
            Action: "iam:CreateServiceLinkedRole"
            Resource: "*"
            Condition:
              StringEquals:
                "iam:AWSServiceName":
                  - "eks.amazonaws.com"
                  - "eks-nodegroup.amazonaws.com"
                  - "elasticloadbalancing.amazonaws.com"
                  - "autoscaling.amazonaws.com"
          - Sid: CreateTheOidcProviderWithTheOwnershipTag
            Effect: Allow
            Action: "iam:CreateOpenIDConnectProvider"
            Resource:
              Fn::Sub: "arn:aws:iam::${AWS::AccountId}:oidc-provider/*"
            Condition:
              "Null":
                "aws:RequestTag/percona.com/pds": "false"
          - Sid: ChangeOwnedOidcProviders
            Effect: Allow
            Action:
              - "iam:GetOpenIDConnectProvider"
              - "iam:DeleteOpenIDConnectProvider"
            Resource:
              Fn::Sub: "arn:aws:iam::${AWS::AccountId}:oidc-provider/*"
            Condition:
              "Null":
                "aws:ResourceTag/percona.com/pds": "false"
          - Sid: ReadRoles
            Effect: Allow
            Action: "iam:GetRole"
            Resource:
              Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/pds/${ConnectionId}/*"

  # The control plane calls these itself, outside any stack: after the cluster
  # is gone it sweeps what the cluster's controllers left, and it makes and
  # empties the backup bucket. Every delete needs an ownership tag, and nothing
  # here creates anything but the bucket.
  CleanupPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: "pds-${ConnectionId}-cleanup"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RemoveWhatCarriesTheOwnershipTag
            Effect: Allow
            Action:
              - "ec2:DeleteVolume"
              - "ec2:DeleteSnapshot"
              - "ec2:DeleteNetworkInterface"
              - "ec2:DeleteSecurityGroup"
              - "elasticloadbalancing:DeleteLoadBalancer"
              - "elasticloadbalancing:DeleteTargetGroup"
            Resource: "*"
            Condition:
              "Null":
                "aws:ResourceTag/percona.com/pds": "false"
              StringEquals:
                "aws:RequestedRegion":
                  Ref: AllowedRegions
          - Sid: RemoveWhatTheLoadBalancerControllerOfAnOwnedClusterMade
            Effect: Allow
            Action:
              - "ec2:DeleteNetworkInterface"
              - "ec2:DeleteSecurityGroup"
              - "elasticloadbalancing:DeleteLoadBalancer"
              - "elasticloadbalancing:DeleteTargetGroup"
            Resource: "*"
            Condition:
              StringLike:
                "aws:ResourceTag/elbv2.k8s.aws/cluster": "pds-*"
              StringEquals:
                "aws:RequestedRegion":
                  Ref: AllowedRegions
          - Sid: RemoveWhatEksMadeForAnOwnedCluster
            Effect: Allow
            Action:
              - "ec2:DeleteNetworkInterface"
              - "ec2:DeleteSecurityGroup"
            Resource: "*"
            Condition:
              StringLike:
                "aws:ResourceTag/aws:eks:cluster-name": "pds-*"
              StringEquals:
                "aws:RequestedRegion":
                  Ref: AllowedRegions
          - Sid: ManageBackupBucketsByNameInThisAccount
            Effect: Allow
            Action:
              - "s3:CreateBucket"
              - "s3:DeleteBucket"
              - "s3:PutBucketTagging"
              - "s3:GetBucketTagging"
              - "s3:PutBucketPublicAccessBlock"
              - "s3:ListBucketVersions"
            Resource: "arn:aws:s3:::pds-*"
            Condition:
              StringEquals:
                "s3:ResourceAccount":
                  Ref: "AWS::AccountId"
          - Sid: EmptyBackupBucketsIncludingEveryVersion
            Effect: Allow
            Action:
              - "s3:DeleteObject"
              - "s3:DeleteObjectVersion"
            Resource: "arn:aws:s3:::pds-*/*"
            Condition:
              StringEquals:
                "s3:ResourceAccount":
                  Ref: "AWS::AccountId"

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "pds-${ConnectionId}-eks-cluster"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "eks.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
      Tags:
        - Key: "percona.com/pds-connection"
          Value:
            Ref: ConnectionId

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "pds-${ConnectionId}-node"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "ec2.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
        - "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
      Tags:
        - Key: "percona.com/pds-connection"
          Value:
            Ref: ConnectionId

  EbsCsiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "pds-${ConnectionId}-ebs-csi"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "pods.eks.amazonaws.com"
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy"
      Tags:
        - Key: "percona.com/pds-connection"
          Value:
            Ref: ConnectionId

  # The agent in an environment runs as this role through EKS Pod Identity, and
  # makes the IAM user its backups write as, so the key is born in the
  # environment and never passes through the control plane. Pod Identity puts the
  # cluster's name on the session, and the policy lets the role touch only the
  # user named after that cluster.
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "pds-${ConnectionId}-agent"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "pods.eks.amazonaws.com"
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
      Policies:
        - PolicyName: make-the-backup-user-of-this-cluster
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MakeTheUserOnlyWithTheBoundary
                Effect: Allow
                Action: "iam:CreateUser"
                Resource:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:user/pds/${ConnectionId}/${!aws:PrincipalTag/eks-cluster-name}-backup"
                Condition:
                  StringEquals:
                    "iam:PermissionsBoundary":
                      Ref: BackupUserBoundary
              - Sid: ManageTheUserOfThisCluster
                Effect: Allow
                Action:
                  - "iam:TagUser"
                  - "iam:PutUserPolicy"
                  - "iam:DeleteUserPolicy"
                  - "iam:ListUserPolicies"
                  - "iam:CreateAccessKey"
                  - "iam:ListAccessKeys"
                  - "iam:DeleteAccessKey"
                  - "iam:DeleteUser"
                Resource:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:user/pds/${ConnectionId}/${!aws:PrincipalTag/eks-cluster-name}-backup"
      Tags:
        - Key: "percona.com/pds-connection"
          Value:
            Ref: ConnectionId

  # Caps what the backup user can ever be granted, whatever policy the agent
  # attaches to it: its own environment's bucket, which is named after the
  # account and the environment.
  BackupUserBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: "pds-${ConnectionId}-backup-boundary"
      Path:
        Fn::Sub: "/pds/${ConnectionId}/"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BackupBucketsOfThisAccount
            Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:DeleteObject"
              - "s3:ListBucket"
              - "s3:GetBucketLocation"
              - "s3:AbortMultipartUpload"
              - "s3:ListBucketMultipartUploads"
              - "s3:ListMultipartUploadParts"
            Resource:
              - Fn::Sub: "arn:aws:s3:::pds-${AWS::AccountId}-*"
              - Fn::Sub: "arn:aws:s3:::pds-${AWS::AccountId}-*/*"

Outputs:
  TemplateVersion:
    Description: The version of this template. The control plane asks for at least the version it ships.
    Value: "3"
  ConnectionId:
    Value:
      Ref: ConnectionId
  ControlPlaneRoleArn:
    Value:
      Fn::GetAtt: [ControlPlaneRole, Arn]
  ServiceRoleArn:
    Value:
      Fn::GetAtt: [ServiceRole, Arn]
  EksClusterRoleArn:
    Value:
      Fn::GetAtt: [EksClusterRole, Arn]
  NodeRoleArn:
    Value:
      Fn::GetAtt: [NodeRole, Arn]
  EbsCsiRoleArn:
    Value:
      Fn::GetAtt: [EbsCsiRole, Arn]
  AgentRoleArn:
    Value:
      Fn::GetAtt: [AgentRole, Arn]
